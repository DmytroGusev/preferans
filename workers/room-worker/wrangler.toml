name = "preferans-room-worker"
main = "src/index.ts"
compatibility_date = "2026-04-07"
workers_dev = true

[vars]
# Sign in with Apple identity-token audience. This is the app's bundle ID, not
# the Team ID-prefixed application identifier used by Universal Links.
APPLE_CLIENT_ID = "com.mixandmatch.preferans"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "PreferansTable"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "PlayerAccountV2"

[[durable_objects.bindings]]
name = "ENGINE"
class_name = "PreferansEngineContainer"

[[containers]]
class_name = "PreferansEngineContainer"
image = "../../Dockerfile.server"
max_instances = 3

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PreferansRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PlayerLibrary"]

# Clean break: new class names allocate fresh namespaces. Existing rooms,
# libraries, and client-declared identities are intentionally not imported.
[[migrations]]
tag = "v3-authenticated-v2"
new_sqlite_classes = ["PreferansRoomV2", "PlayerAccountV2"]

# Clean break from peer-hosted game state. Room V3 owns opaque Swift engine
# state; the container class is a stateless transition pool.
[[migrations]]
tag = "v4-server-authoritative-v3"
new_sqlite_classes = ["PreferansRoomV3", "PreferansEngineContainer"]

# No compatibility: new tables use the durable receipt protocol.
[[migrations]]
tag = "v5-durable-table"
new_sqlite_classes = ["PreferansTable"]
deleted_classes = ["PreferansRoom", "PlayerLibrary", "PreferansRoomV2", "PreferansRoomV3"]

[observability]
enabled = true

[[ratelimits]]
name = "REQUEST_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
