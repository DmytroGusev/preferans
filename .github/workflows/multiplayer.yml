name: Multiplayer contracts
on:
  push:
  pull_request:
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: workers/room-worker
      - run: bun run check
        working-directory: workers/room-worker
  portable-engine:
    runs-on: ubuntu-latest
    container: swift:6.3.2-jammy
    steps:
      - uses: actions/checkout@v4
      - run: PREFERANS_ENGINE_TESTS_ONLY=1 swift test
